AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Debtrix serverless backend

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps

Resources:
  DebtrixHttpApi:
    Type: AWS::Serverless::HttpApi # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
          - DELETE
  CalculateSplitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/calculateSplit/handler.handler
      Events:
        CalculateSplit:
          Type: HttpApi
          Properties:
            ApiId: !Ref DebtrixHttpApi
            Path: /calculate-split
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/calculateSplit/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  ApiUrl:
    Description: Debtrix API URL
    Value: !Sub "https://${DebtrixHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
